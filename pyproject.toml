[project]
name = "comfyui-omniavatar"
description = "A ComfyUI custom node based on OmniAvatar that generates video sequences with synchronized lip movements and facial expressions from a portrait image, audio, and a text prompt. Parameters and invocation follow the official OmniAvatar inference."
version = "0.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "torch>=1.13",
  "numpy==1.26.4",
  "scipy==1.14.0",
  "librosa==0.10.2.post1",
  "tqdm",
  "peft==0.15.1",
  "transformers==4.52.3",
  "xfuser==0.4.1",
  "ftfy",
  "einops",
  "omegaconf",
  "ffmpeg-python",
  "dlib",
  "face_alignment",
  "opencv-python",
  "soundfile",
  "Pillow",
]

[project.urls]
Repository = "https://github.com/CallMe1101/ComfyUI_OmniAvatar"
Documentation = "https://github.com/CallMe1101/ComfyUI_OmniAvatar/wiki"
"Bug Tracker" = "https://github.com/CallMe1101/ComfyUI_OmniAvatar/issues"

[tool.comfy]
PublisherId = "callme"
DisplayName = "ComfyUI OmniAvatar"
Icon = ""
includes = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
