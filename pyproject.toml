[project]
name = "omniavatar"
description = "A ComfyUI custom node developed based on OmniAvatar, capable of generating video sequences with synchronized lip movements and facial expressions by inputting a portrait image, audio, and text prompt. The node parameters and invocation method are fully consistent with the official OmniAvatar inference."
version = "1.0.0"
license = {file = "LICENSE"} 
# classifiers = [
#     # For OS-independent nodes (works on all operating systems)
#     "Operating System :: OS Independent",
#
#     # OR for OS-specific nodes, specify the supported systems:
#     "Operating System :: Microsoft :: Windows",  # Windows specific
#     "Operating System :: POSIX :: Linux",  # Linux specific
#     "Operating System :: MacOS",  # macOS specific
#
#     # GPU Accelerator support. Pick the ones that are supported by your extension.
#     "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = ["torch>=1.13", "numpy==1.26.4", "scipy==1.14.0", "librosa==0.10.2.post1", "tqdm", "peft==0.15.1", "transformers==4.52.3", "scipy==1.14.0", "xfuser==0.4.1", "ftfy", "einops", "omegaconf", "ffmpeg-python", "dlib", "face_alignment", "opencv-python", "soundfile", "Pillow", "# 额外建议", "# faiss-cpu   # 部分依赖（如有报错可按需安装）", "# 其他依赖如bitsandbytes、gradio等仅用于训练/调试可选安装"]

[project.urls]
Repository = "https://github.com/CallMe1101/ComfyUI_OmniAvatar"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/CallMe1101/ComfyUI_OmniAvatar/wiki"
"Bug Tracker" = "https://github.com/CallMe1101/ComfyUI_OmniAvatar/issues"

[tool.comfy]
PublisherId = ""
DisplayName = "ComfyUI_OmniAvatar"
Icon = ""
includes = [] 
